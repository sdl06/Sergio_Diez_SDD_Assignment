services:
  ui:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./ui:/usr/share/nginx/html:ro
  attendance:
    build: ./services/attendance
    ports: ["8001:8000"]
    environment:
      UI_ORIGIN: "${SCHOOLRUN_UI_ORIGIN:-http://localhost:8080}"
      TRIP_OPS_BASE_URL: http://trip-ops:8000
      DATABASE_URL: "${ATTENDANCE_DATABASE_URL:?Set ATTENDANCE_DATABASE_URL}"
      SQL_EXTRA_PARAMS: "Encrypt=yes;TrustServerCertificate=yes"
  trip-ops:
    build: ./services/trip-ops
    ports: ["8002:8000"]
    environment:
      UI_ORIGIN: "${SCHOOLRUN_UI_ORIGIN:-http://localhost:8080}"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,trip-ops
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8001,http://127.0.0.1:8001
      DATABASE_URL: "${TRIP_OPS_DATABASE_URL:?Set TRIP_OPS_DATABASE_URL}"
      SQL_EXTRA_PARAMS: "Encrypt=yes;TrustServerCertificate=yes"
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
volumes:
  sql_data:
